# Runs the tests, then builds the installers for every platform and attaches
# them to a draft GitHub release. Run it by pushing a tag such as v0.1.0.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          bash scripts/ci/apt.sh
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages; the app holds the public key. Free: Tauri's own signing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: UltimateMD ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseDraft: true
          # Update packages and latest.json, which running apps read to update themselves.
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
      # A folder to unzip and run, for example from a USB drive. The `portable`
      # file makes the app keep its data in `datos` beside it.
      - name: Pack the Windows portable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = if ($env:TAG) { $env:TAG } else { "v$version" }
          $out = "target/${{ matrix.target }}/release"
          $app = @("$out/UltimateMD.exe", "$out/ultimatemd.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $app) { throw "No app executable in $out" }
          $dir = New-Item -ItemType Directory -Force portable/UltimateMD
          Copy-Item $app "$dir/UltimateMD.exe"
          Copy-Item "$out/ultimatemd-mcp.exe" "$dir/ultimatemd-mcp.exe"
          New-Item -ItemType File "$dir/portable" | Out-Null
          Copy-Item src-tauri/windows/LEEME-portable.txt "$dir/LEEME.txt"
          $zip = "UltimateMD_${version}_x64_portable.zip"
          Compress-Archive -Path portable/UltimateMD -DestinationPath $zip
          gh release upload $tag $zip --clobber
      # Installs what was just built and checks that it starts. The files are
      # already on the draft release; a failure here says not to publish it.
      - name: Try the Windows installers and the portable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          ./scripts/smoke/windows.ps1 -Bundles target/${{ matrix.target }}/release/bundle -Version $version -Portable (Get-Item "UltimateMD_${version}_x64_portable.zip").FullName
      - name: Try the installers
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then bash scripts/ci/apt.sh && sudo apt-get install -y xvfb; fi
          bash scripts/smoke/unix.sh target/${{ matrix.target }}/release/bundle "$(node -p "require('./src-tauri/tauri.conf.json').version")" ${{ matrix.target }}
