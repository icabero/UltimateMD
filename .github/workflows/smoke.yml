# Installs the files of a published release and checks that they start, with
# the same scripts the release workflow runs after building. Run it by hand
# for any release; it also runs by itself when those scripts change, against
# the latest release, so a change to them is tried before the next release.
name: Try a release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release to try, such as v0.7.0. Empty for the latest.
        required: false
  push:
    branches: [develop]
    paths:
      - .github/workflows/smoke.yml
      - scripts/smoke/**

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            dmg: '*_aarch64.dmg'
          - os: macos-latest
            target: x86_64-apple-darwin
            dmg: '*_x64.dmg'
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Laid out as the build leaves them, which is what the scripts expect.
      - name: Download the release
        shell: bash
        run: |
          tag=${TAG:-$(gh release view --json tagName --jq .tagName)}
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
          get() { mkdir -p "bundle/$1"; gh release download "$tag" -p "$2" -D "bundle/$1"; }
          case "$RUNNER_OS" in
            Windows) get nsis '*-setup.exe'; get msi '*.msi'; get . '*_portable.zip' ;;
            Linux) get deb '*.deb'; get appimage '*.AppImage' ;;
            macOS) get dmg '${{ matrix.dmg }}' ;;
          esac
          find bundle -type f
      - name: Try the Windows installers and the portable
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke/windows.ps1 -Bundles bundle -Version $env:VERSION -Portable (Get-Item bundle/*_portable.zip).FullName
      - name: Try the installers
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y xvfb; fi
          bash scripts/smoke/unix.sh bundle "$VERSION" ${{ matrix.target }}
