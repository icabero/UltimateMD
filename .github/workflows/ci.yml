name: CI

on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
  pull_request:
  workflow_call:

permissions:
  contents: read

# One queue per pull request or branch, so branches never wait for each
# other. A new push cancels the run it replaces, except on main and develop,
# where every commit is checked.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Branches start from the cache of main and develop, the only ones to save it.
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          bash scripts/ci/apt.sh
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev
      # Style and lints do not depend on the system, so one runner checks them.
      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - run: npm ci
      - run: npm run check
      - name: Unit tests of the frontend
        run: npm test
      - name: Lint TypeScript and Svelte
        if: runner.os == 'Linux'
        run: npm run lint
      - run: npm run build:web
      - run: npm run sidecar -- --debug
      - run: cargo test -p ultimatemd-core -p ultimatemd-mcp -p ultimatemd-pdf
      - name: Lint Rust
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The app's test binary cannot start on Windows without the manifest
      # that a real build embeds, so there it is only checked.
      - name: Test the app crate
        if: runner.os != 'Windows'
        run: cargo test -p ultimatemd
      - name: Check the app crate
        if: runner.os == 'Windows'
        run: cargo check -p ultimatemd
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
      - name: Install the test browser's Linux libraries
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
