# Weekly update proposals. Grouped, so they arrive as one pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
