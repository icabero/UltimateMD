[package]
name = "ultimatemd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Markdown vaults with diagrams and MCP"
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ultimatemd-core = { path = "../crates/core" }
ultimatemd-pdf = { path = "../crates/pdf" }
base64 = "0.23"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
notify-debouncer-full = "0.7"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# Only to say that WebView2 is missing, when no window can open.
rfd = { version = "0.17", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
